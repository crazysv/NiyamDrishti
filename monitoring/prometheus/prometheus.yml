# Prometheus configuration for NiyamDrishti Legal Metrology Inspection System
# Scrapes backend FastAPI metrics every 15s

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "niyamdrishti-api"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["api:8000"]
        labels:
          app: "niyamdrishti"
          service: "backend-api"
          environment: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
