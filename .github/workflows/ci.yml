name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Backend - lint, type-check, test
  # Uses requirements-ci.txt which excludes heavy ML packages (paddlepaddle,
  # paddleocr, opencv) that are only needed at runtime, not for CI checks.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend - lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: Format check (Ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports --no-strict-optional

      - name: Run tests (pytest)
        env:
          APP_ENV: development
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          JWT_SECRET_KEY: ci-test-secret-at-least-32-chars-long
          JWT_ALGORITHM: HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
          CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'
        run: pytest --cov=app --cov-report=term-missing -q --tb=short

  # ---------------------------------------------------------------------------
  # Frontend - lint, type-check, build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend - lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
