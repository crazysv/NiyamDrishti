distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 8.13 is already present in this development machine's wrapper cache and
# matches Android Gradle Plugin 8.13.0 used by this project. The smaller binary
# distribution avoids an unnecessary external download during the first APK build.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
